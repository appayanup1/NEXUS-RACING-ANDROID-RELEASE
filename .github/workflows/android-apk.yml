name: 'Build NEXUS RACING signed release APK (one ZIP in a GitHub Release)'

# ======================================================================================================================
# HOW THIS WORKS (nothing has to be edited inside this file)
#
# 1. In your repository create a GitHub Release with an EXACT tag (for example nexus-h2r-v1)
#    and attach ONE file to it:  NEXUS_RACING-FINAL.zip  (or NEXUS_RACING_FIXED_SOURCE.zip, both names are accepted)
#
# 2. Actions tab -> "Build NEXUS RACING signed release APK ..." -> Run workflow -> type that exact tag
#    (publishing the Release also starts the build, with that Release's own tag).
#
# There is NO fallback: an empty tag, the old tag "v.10", "latest", a tag that does not exist or a ZIP that is incomplete FAILS the run
# with a clear message. The workflow never silently uses another Release.
#
# Design checks: every screen uses the blue / gold / purple card tones, the home screen has the LOOK button and the LOOK sliders update live.
# Animation / UX checks (v1.7): ui/Motion.kt (motion tokens, AmbientView, ShineView on PLAY, Fonts.num), the Tektur number font,
# every screen built by the Navigator with the ambient layer, and the two extra colour presets (Neon Rose, Ice Cyan).
# STUNT / RAMP checks (v1.7 game update): gameplay/Stunt.kt (8 stunts + air control), gameplay/Ramps.kt, graphics/Rebase.kt (floating origin),
# the STUNT button + radial selector + air pad in GameView, the two ramp GLBs (assets/map/ramps/), the stunt-ramps setting, the multiplayer
# stunt state / unlimited ride. A ZIP that lacks any of them FAILS the run instead of building a game without the new features.
#
# The Kotlin package folder is found automatically, so renaming the package id never breaks this workflow.
# Multiplayer server address (optional): repository variable NEXUS_BACKEND_URL (wss://...). The backend is not touched by this workflow.
# (The v1.7 game needs the v1.7 backend: upload NEXUS_RACING-Backend-v1.7-STUNT.zip with the backend workflow first.)
# Another ZIP name (optional): repository variable BUNDLE_ZIP_NAME.
#
# SIGNED RELEASE BUILD: the APK is a RELEASE build signed with ONE permanent key, so every new APK installs over the old one.
# Required repository SECRETS (Settings > Secrets and variables > Actions > Secrets): see SIGNING_SETUP_GUIDE.md
#   NEXUS_KEYSTORE_BASE64    the keystore file, Base64 encoded (one single line of text)
#   NEXUS_KEYSTORE_PASSWORD  keystore password
#   NEXUS_KEY_ALIAS          key alias
#   NEXUS_KEY_PASSWORD       key password
# Optional repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   NEXUS_EXPECTED_CERT_SHA256  the public SHA-256 fingerprint of your key (printed by the first successful run)
#   NEXUS_VERSION_NAME          the version name shown to players (default 1.4.0)
# versionCode = minutes since 1970 at build time: it grows with every run automatically.
# If a secret is missing the run STOPS at the start with a clear message; no unsigned APK is ever uploaded.
# ======================================================================================================================

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact Release tag that holds the ZIP (required), for example nexus-h2r-v1'
        required: true
        type: string
      version_name:
        description: 'Version name shown to players, for example 1.4.1 (optional; default = variable NEXUS_VERSION_NAME or 1.4.0)'
        required: false
        type: string
  release:
    types: [published]

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  BUNDLE_ZIP_NAME: ${{ vars.BUNDLE_ZIP_NAME || 'NEXUS_RACING-FINAL.zip' }}
  ALT_ZIP_NAME: NEXUS_RACING_FIXED_SOURCE.zip
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  NEXUS_BACKEND_URL: ${{ vars.NEXUS_BACKEND_URL || '' }}
  NEXUS_EXPECTED_CERT_SHA256: ${{ vars.NEXUS_EXPECTED_CERT_SHA256 || '' }}
  VERSION_NAME_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '' }}
  VERSION_NAME_VAR: ${{ vars.NEXUS_VERSION_NAME || '' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:

      # ------------------------------------------------------------ 1. the Release tag must be explicit and valid
      - name: Check the Release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(echo "${RELEASE_TAG:-}" | tr -d '[:space:]')"
          if [ -z "$TAG" ]; then
            echo "::error::No Release tag given. Run the workflow again and type the exact tag (for example nexus-h2r-v1)."
            exit 1
          fi
          case "$TAG" in
            latest|LATEST|Latest) echo "::error::The tag 'latest' is not accepted. Use the exact tag, for example nexus-h2r-v1."; exit 1 ;;
            v.10) echo "::error::The old tag 'v.10' is not accepted: it holds the old Countryside-only package. Use the exact tag of your newest Release."; exit 1 ;;
          esac
          if ! echo "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::The tag '$TAG' contains characters that are not allowed."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag : $TAG"
          echo "ZIP         : $BUNDLE_ZIP_NAME"

      # ------------------------------------------------------------ 1b. the permanent signing secrets must exist
      - name: Check that the signing secrets exist
        shell: bash
        env:
          S_KS: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          S_KSP: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          S_KEYP: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=0
          [ -n "${S_KS:-}" ]    || { echo "::error::Missing repository secret NEXUS_KEYSTORE_BASE64 (the keystore file as Base64 text)."; MISSING=1; }
          [ -n "${S_KSP:-}" ]   || { echo "::error::Missing repository secret NEXUS_KEYSTORE_PASSWORD."; MISSING=1; }
          [ -n "${S_ALIAS:-}" ] || { echo "::error::Missing repository secret NEXUS_KEY_ALIAS."; MISSING=1; }
          [ -n "${S_KEYP:-}" ]  || { echo "::error::Missing repository secret NEXUS_KEY_PASSWORD."; MISSING=1; }
          if [ "$MISSING" = 1 ]; then
            echo "::error::The release APK can only be built with your permanent signing key. Create the four secrets (see SIGNING_SETUP_GUIDE.md) and run again. No APK was built."
            exit 1
          fi
          echo "All 4 signing secrets are present (values are never printed)."

      - name: Decide versionCode and versionName
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(( $(date -u +%s) / 60 ))
          NAME="${VERSION_NAME_INPUT:-}"
          [ -n "$NAME" ] || NAME="${VERSION_NAME_VAR:-}"
          [ -n "$NAME" ] || NAME="1.4.0"
          NAME="$(echo "$NAME" | tr -d '[:space:]')"
          echo "$NAME" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]{0,30}$' || { echo "::error::versionName '$NAME' has characters that are not allowed (use letters, digits, dots, dashes)."; exit 1; }
          if [ "$CODE" -le 4 ] || [ "$CODE" -ge 2100000000 ]; then echo "::error::Computed versionCode $CODE is outside the allowed range."; exit 1; fi
          echo "NEXUS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "NEXUS_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionCode : $CODE  (grows every run)"
          echo "versionName : $NAME"

      # ------------------------------------------------------------ 2. download exactly that Release's bundle
      - name: Download the ZIP from the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf bundle_dl && mkdir -p bundle_dl
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release '$RELEASE_TAG' does not exist in $GITHUB_REPOSITORY (or it is still a draft). Create and publish it first."
            exit 1
          fi
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BUNDLE_ZIP_NAME" --pattern "$ALT_ZIP_NAME" --dir bundle_dl --clobber; then
            echo "::error::Release '$RELEASE_TAG' has no asset named $BUNDLE_ZIP_NAME (or $ALT_ZIP_NAME). Attach the ZIP to that Release."
            echo "Assets that the Release does have:"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true
            exit 1
          fi
          if [ -f "bundle_dl/$BUNDLE_ZIP_NAME" ]; then B="bundle_dl/$BUNDLE_ZIP_NAME"; else B="bundle_dl/$ALT_ZIP_NAME"; fi
          ZIPNAME="$(basename "$B")"
          SIZE=$(stat -c %s "$B")
          echo "Download URL : https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ZIPNAME"
          echo "Size         : $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then echo "::error::$ZIPNAME is only $SIZE bytes: that is not the complete project ZIP."; exit 1; fi
          unzip -tq "$B" > /dev/null || { echo "::error::$ZIPNAME is not a valid ZIP (broken upload?)."; exit 1; }
          echo "BUNDLE_PATH=$GITHUB_WORKSPACE/$B" >> "$GITHUB_ENV"
          echo "BUNDLE_ZIP_USED=$ZIPNAME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------ 3. extract the one ZIP
      - name: Extract the project ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project && mkdir -p project
          unzip -q -o "$BUNDLE_PATH" -d project -x '__MACOSX/*' || true
          ROOT=""
          for dp in $(find project -maxdepth 3 -type d); do
            if [ -f "$dp/settings.gradle.kts" ]; then ROOT="$dp"; break; fi
          done
          if [ -z "$ROOT" ]; then
            echo "::error::${BUNDLE_ZIP_USED:-the ZIP} has no settings.gradle.kts: this is not the complete NEXUS RACING project ZIP."
            exit 1
          fi
          A="$ROOT/app/src/main/assets"
          for d in "$A/map/countryside" "$A/map/nightcity" "$A/map/ramps" "$A/npc" "$A/models" "$A/config"; do
            [ -d "$d" ] || { echo "::error::Missing folder inside the ZIP: ${d#$ROOT/}"; exit 1; }
          done
          echo "Android project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      # ------------------------------------------------------------ 4. code checks
      - name: Check the Android project files and the map registration in the code
        shell: bash
        run: |
          set -euo pipefail
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            [ -f "$PROJECT_DIR/$f" ] || { echo "::error::$PROJECT_DIR/$f is missing"; exit 1; }
          done
          CFG="$(find "$PROJECT_DIR/app/src/main/kotlin" -path '*/data/Config.kt' | head -n 1)"
          if [ -z "$CFG" ]; then echo "::error::data/Config.kt was not found under app/src/main/kotlin."; exit 1; fi
          K="$(dirname "$(dirname "$CFG")")"
          echo "Kotlin package folder: ${K#$PROJECT_DIR/}"
          grep -q 'const val COUNTRY = 6' "$K/data/Config.kt"   || { echo "::error::Config.kt: Countryside (COUNTRY = 6) is not registered."; exit 1; }
          grep -q 'const val NIGHTCITY = 7' "$K/data/Config.kt" || { echo "::error::Config.kt: NEXUS NIGHT CITY (NIGHTCITY = 7) is not registered."; exit 1; }
          grep -q '"NEXUS NIGHT CITY"' "$K/data/Config.kt"      || { echo "::error::Config.kt: the NEXUS NIGHT CITY map entry is missing."; exit 1; }
          [ -f "$K/graphics/NightCity.kt" ] || { echo "::error::graphics/NightCity.kt is missing."; exit 1; }
          [ -f "$K/ui/NightCityCard.kt" ]   || { echo "::error::ui/NightCityCard.kt is missing."; exit 1; }
          [ -f "$K/ui/CountrysideCard.kt" ] || { echo "::error::ui/CountrysideCard.kt is missing (Countryside must be kept)."; exit 1; }
          grep -q 'NightCityCard' "$K/ui/MapChooser.kt"         || { echo "::error::MapChooser.kt does not use NightCityCard."; exit 1; }
          grep -q 'NightCity.preload' "$K/GameActivity.kt"      || { echo "::error::GameActivity.kt does not preload the Night City models."; exit 1; }
          grep -q 'env.kind == 7' "$K/graphics/SceneDrawer.kt"  || { echo "::error::SceneDrawer.kt has no scenery for map kind 7."; exit 1; }
          grep -q 'itemCountry' "$K/graphics/SceneDrawer.kt"    || { echo "::error::SceneDrawer.kt lost the Countryside scenery."; exit 1; }
          [ -f "$K/ui/LyricsView.kt" ]      || { echo "::error::ui/LyricsView.kt is missing."; exit 1; }
          [ -f "$K/ui/GradeUi.kt" ]         || { echo "::error::ui/GradeUi.kt is missing."; exit 1; }
          [ -f "$K/graphics/GradeKit.kt" ]  || { echo "::error::graphics/GradeKit.kt is missing."; exit 1; }
          [ -f "$K/graphics/Grade.kt" ]     || { echo "::error::graphics/Grade.kt is missing."; exit 1; }
          [ -f "$K/graphics/GradeCode.kt" ] || { echo "::error::graphics/GradeCode.kt is missing."; exit 1; }
          grep -q 'askCode' "$K/ui/GradeUi.kt"                 || { echo "::error::GradeUi.kt has no 'enter a look code' option."; exit 1; }
          grep -q 'grade?.apply' "$K/graphics/RaceRenderer.kt" || { echo "::error::RaceRenderer.kt does not apply the colour grading pass."; exit 1; }
          [ -f "$K/ui/HomeScreen.kt" ]      || { echo "::error::ui/HomeScreen.kt is missing."; exit 1; }
          [ -f "$K/ui/NeonStyle.kt" ]       || { echo "::error::ui/NeonStyle.kt is missing."; exit 1; }
          [ -f "$K/ui/LookScreen.kt" ]      || { echo "::error::ui/LookScreen.kt is missing."; exit 1; }
          grep -q 'LookScreen' "$K/ui/HomeScreen.kt"           || { echo "::error::HomeScreen.kt has no LOOK button."; exit 1; }
          grep -q 'enum class Tone' "$K/ui/NeonStyle.kt"        || { echo "::error::NeonStyle.kt has no Tone colour families."; exit 1; }
          grep -q 'class StreakDrawable' "$K/ui/NeonStyle.kt"   || { echo "::error::NeonStyle.kt has no StreakDrawable."; exit 1; }
          grep -q 'Tone.PURPLE' "$K/ui/HomeScreen.kt"           || { echo "::error::HomeScreen.kt: MULTIPLAYER must use the purple tone."; exit 1; }
          grep -q 'Tone.GOLD' "$K/ui/HomeScreen.kt"             || { echo "::error::HomeScreen.kt: GARAGE and DAILY REWARDS must use the gold tone."; exit 1; }
          grep -q 'lookBtn' "$K/ui/HomeScreen.kt"               || { echo "::error::HomeScreen.kt has no LOOK button."; exit 1; }
          [ "$(grep -c 'previewMatrix(Grade.live)' "$K/ui/LookScreen.kt")" -ge 2 ] || { echo "::error::LookScreen.kt: the sliders do not update the preview live."; exit 1; }
          grep -q 'onChange' "$K/ui/GradeUi.kt"                 || { echo "::error::GradeUi.kt has no live onChange callback."; exit 1; }
          grep -q 'class BikeSilhouetteDrawable' "$K/ui/NeonStyle.kt" || { echo "::error::NeonStyle.kt has no BikeSilhouetteDrawable."; exit 1; }
          grep -q 'BikeSilhouetteDrawable' "$K/ui/HomeScreen.kt"      || { echo "::error::HomeScreen.kt does not draw the bike outline."; exit 1; }
          grep -q 'private val skew' "$K/ui/NeonStyle.kt"             || { echo "::error::NeonStyle.kt: GlassDrawable has no skew shape."; exit 1; }
          grep -q 'private val glint' "$K/ui/NeonStyle.kt"            || { echo "::error::NeonStyle.kt: GlassDrawable has no glint."; exit 1; }
          grep -q 'android:alertDialogTheme' "$PROJECT_DIR/app/src/main/res/values/styles.xml" || { echo "::error::styles.xml has no dark dialog theme."; exit 1; }
          [ -f "$PROJECT_DIR/app/src/main/res/drawable/dialog_bg.xml" ] || { echo "::error::res/drawable/dialog_bg.xml is missing."; exit 1; }
          grep -q 'addView(view, 1,' "$K/ui/LyricsView.kt"     || { echo "::error::LyricsView must sit BELOW the HUD (index 1)."; exit 1; }
          [ -f "$K/audio/SampleBank.kt" ]   || { echo "::error::audio/SampleBank.kt is missing."; exit 1; }
          grep -q 'useSamples' "$K/GameActivity.kt"            || { echo "::error::GameActivity.kt does not switch the H2R to the recorded engine."; exit 1; }
          grep -q 'openLyricsPicker' "$K/ui/MusicPicUi.kt"      || { echo "::error::MusicPicUi.kt has no lyrics-video import button."; exit 1; }
          grep -q 'REQ_LYR' "$K/MainActivity.kt"               || { echo "::error::MainActivity.kt does not forward the lyrics-video picker result."; exit 1; }
          grep -q 'LyricsLayer' "$K/GameActivity.kt"           || { echo "::error::GameActivity.kt does not use the lyrics layer."; exit 1; }
          # ---- v1.7 animation / UX pass
          [ -f "$K/ui/Motion.kt" ]          || { echo "::error::ui/Motion.kt is missing."; exit 1; }
          grep -q 'object Motion' "$K/ui/Motion.kt"            || { echo "::error::Motion.kt has no 'object Motion'."; exit 1; }
          grep -q 'class AmbientView' "$K/ui/Motion.kt"        || { echo "::error::Motion.kt has no AmbientView."; exit 1; }
          grep -q 'class ShineView' "$K/ui/Motion.kt"          || { echo "::error::Motion.kt has no ShineView."; exit 1; }
          grep -q 'object Fonts' "$K/ui/Motion.kt"             || { echo "::error::Motion.kt has no 'object Fonts'."; exit 1; }
          grep -q 'fonts/Tektur-Medium.ttf' "$K/ui/Motion.kt"  || { echo "::error::Motion.kt does not load fonts/Tektur-Medium.ttf."; exit 1; }
          grep -q 'AmbientView' "$K/ui/Navigator.kt"           || { echo "::error::Navigator.kt does not put the AmbientView behind every screen."; exit 1; }
          grep -q 'ShineView' "$K/ui/HomeScreen.kt"            || { echo "::error::HomeScreen.kt has no ShineView on PLAY."; exit 1; }
          grep -q 'Fonts.num' "$K/ui/Ui.kt"                    || { echo "::error::Ui.kt does not use the number font (Fonts.num)."; exit 1; }
          grep -q 'Neon Rose' "$K/ui/Theme.kt"                 || { echo "::error::Theme.kt: preset 'Neon Rose' is missing."; exit 1; }
          grep -q 'Ice Cyan' "$K/ui/Theme.kt"                  || { echo "::error::Theme.kt: preset 'Ice Cyan' is missing."; exit 1; }
          grep -q '"m4a"' "$PROJECT_DIR/app/build.gradle.kts"  || { echo "::error::app/build.gradle.kts: m4a / mp4 must be in noCompress."; exit 1; }
          # ---- v1.7 STUNT / RAMP / MULTIPLAYER update
          [ -f "$K/gameplay/Stunt.kt" ]     || { echo "::error::gameplay/Stunt.kt is missing."; exit 1; }
          [ -f "$K/gameplay/Ramps.kt" ]     || { echo "::error::gameplay/Ramps.kt is missing."; exit 1; }
          [ -f "$K/graphics/Rebase.kt" ]    || { echo "::error::graphics/Rebase.kt is missing."; exit 1; }
          grep -q 'class StuntState' "$K/gameplay/Stunt.kt"    || { echo "::error::Stunt.kt has no StuntState."; exit 1; }
          grep -q 'class RampField' "$K/gameplay/Ramps.kt"     || { echo "::error::Ramps.kt has no RampField."; exit 1; }
          grep -q 'val stunt = StuntState' "$K/gameplay/RaceSim.kt" || { echo "::error::RaceSim.kt does not own the stunt system."; exit 1; }
          grep -q 'stunt.pre(' "$K/gameplay/RaceSim.kt"        || { echo "::error::RaceSim.kt does not run stunt.pre."; exit 1; }
          grep -q 'stunt.post(' "$K/gameplay/RaceSim.kt"       || { echo "::error::RaceSim.kt does not run stunt.post."; exit 1; }
          grep -q 'stuntButton' "$K/controls/GameView.kt"      || { echo "::error::GameView.kt has no STUNT button."; exit 1; }
          grep -q 'stuntRadial' "$K/controls/GameView.kt"      || { echo "::error::GameView.kt has no radial stunt selector."; exit 1; }
          grep -q 'airPad' "$K/controls/GameView.kt"           || { echo "::error::GameView.kt has no air pad."; exit 1; }
          if grep -q 'private fun wheelieButton' "$K/controls/GameView.kt"; then echo "::error::GameView.kt still has the old separate Wheelie button."; exit 1; fi
          grep -q 'drawRamps' "$K/graphics/SceneDrawer.kt"     || { echo "::error::SceneDrawer.kt does not draw the stunt ramps."; exit 1; }
          grep -q 'stuntAttitude' "$K/graphics/SceneDrawer.kt" || { echo "::error::SceneDrawer.kt does not draw the stunt attitude."; exit 1; }
          grep -q 'Rebase.zOrg' "$K/graphics/GlKit.kt"         || { echo "::error::GlKit.kt does not apply the floating origin."; exit 1; }
          grep -q 'Rebase.zOrg' "$K/graphics/GlbGpu.kt"        || { echo "::error::GlbGpu.kt does not apply the floating origin."; exit 1; }
          grep -q 'stuntRamps' "$K/persistence/SaveData.kt"    || { echo "::error::SaveData.kt has no STUNT RAMPS setting."; exit 1; }
          grep -q 'rampLaunch' "$K/audio/Sound.kt"             || { echo "::error::Sound.kt has no ramp launch sound."; exit 1; }
          grep -q 'configureRamps' "$K/GameActivity.kt"        || { echo "::error::GameActivity.kt does not switch the ramps on / off."; exit 1; }
          grep -q 'val unlimited' "$K/multiplayer/MpModels.kt" || { echo "::error::MpModels.kt has no unlimited-ride room setting."; exit 1; }
          grep -q '"caps"' "$K/multiplayer/Mp.kt"              || { echo "::error::Mp.kt does not announce its capabilities."; exit 1; }
          grep -q 'serverStunt' "$K/multiplayer/Mp.kt"         || { echo "::error::Mp.kt does not send the stunt state."; exit 1; }
          grep -q 'renderNow' "$K/multiplayer/RemoteRacers.kt" || { echo "::error::RemoteRacers.kt has no smoothed render clock."; exit 1; }
          if grep -E 'GfxPreset\("(LOW|MEDIUM)", *[0-9.]+f?, *[12],' "$K/data/Config.kt" > /dev/null; then echo "::error::Config.kt: LOW / MEDIUM graphics remove scenery (scenery < 3)."; exit 1; fi
          echo "Project folder: $PROJECT_DIR"
          if [ -n "$NEXUS_BACKEND_URL" ]; then
            case "$NEXUS_BACKEND_URL" in
              wss://*) echo "Multiplayer server (repository variable): $NEXUS_BACKEND_URL" ;;
              *) echo "::error::The repository variable NEXUS_BACKEND_URL must start with wss:// . Current value: $NEXUS_BACKEND_URL"; exit 1 ;;
            esac
          else
            echo "NEXUS_BACKEND_URL variable not set: the address from gradle.properties / MpConfig.kt is used."
            grep -n '^NEXUS_BACKEND_URL' "$PROJECT_DIR/gradle.properties" || true
          fi

      # ------------------------------------------------------------ 5. assets are checked from the project's OWN config files
      - name: Verify vehicles, NPC registry, audio, ramps and BOTH maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets" <<'PY'
          import json, os, struct, sys
          a = sys.argv[1]
          errors = 0
          def err(m):
              global errors; errors += 1; print("::error::" + m)
          def glb(p, what):
              f = os.path.join(a, p)
              if not os.path.isfile(f): err("Missing %s %s (is a ZIP part missing?)" % (what, p)); return
              with open(f, "rb") as h: raw = h.read()
              if raw[:4] != b"glTF": err("%s is not a valid GLB" % p); return
              print("ok  %-30s %7.2f MB  (%s)" % (p, os.path.getsize(f) / 1e6, what))
          bikes = json.load(open(a + "/config/bikes.json"))
          for b in bikes:
              g = (b.get("model") or {}).get("glb")
              if g: glb(g, "bike " + b["id"])
          ids = [b["id"] for b in bikes]
          for b in bikes:
              f = os.path.join(a, "ui", "bike_%s.png" % b["id"])
              if not os.path.isfile(f): err("Missing speedometer icon ui/bike_%s.png" % b["id"])
              elif open(f, "rb").read(4) != b"\x89PNG": err("ui/bike_%s.png is not a PNG" % b["id"])
              if not (b.get("custom") or {}).get("paint"): err("bike %s has no custom.paint materials in config/bikes.json" % b["id"])
          if ids[-1] != "kawasaki_h2r": err("kawasaki_h2r must be the LAST bike in config/bikes.json (found %s)" % ids[-1])
          if "kawasaki_zx10r" not in ids: err("bike kawasaki_zx10r is missing in config/bikes.json")
          h2 = [b for b in bikes if b["id"] == "kawasaki_h2r"]
          if h2:
              if h2[0].get("topSpeedKmh") != 420 or (h2[0].get("phys") or {}).get("speedCapKmh") != 420: err("kawasaki_h2r top speed must be 420 km/h")
              if abs(((h2[0].get("phys") or {}).get("nitroTopMul") or 0) * 420 - 450) > 1: err("kawasaki_h2r nitro top speed must be 450 km/h")
              if not h2[0].get("fx"): err("kawasaki_h2r has no fx block")
          for r in json.load(open(a + "/config/riders.json")): glb(r["glb"], "rider")
          npc = json.load(open(a + "/config/npc_vehicles.json"))
          if len(npc) < 10: err("config/npc_vehicles.json lists only %d NPC vehicles" % len(npc))
          for n in npc: glb(n["glb"], "npc " + n["id"])
          # the two STUNT RAMP models (v1.7)
          for rp in ["map/ramps/ramp_wood.glb", "map/ramps/ramp_industrial.glb"]:
              glb(rp, "stunt ramp")
              fr = os.path.join(a, rp)
              if os.path.isfile(fr) and os.path.getsize(fr) < 200000: err("%s is too small (broken upload?)" % rp)
          if not os.path.isfile(os.path.join(a, "fonts", "hud_slab.ttf")): err("Missing fonts/hud_slab.ttf")
          tk = os.path.join(a, "fonts", "Tektur-Medium.ttf")
          if not os.path.isfile(tk): err("Missing fonts/Tektur-Medium.ttf")
          else:
              hd = open(tk, "rb").read(4)
              if hd not in (b"\x00\x01\x00\x00", b"true", b"OTTO"): err("fonts/Tektur-Medium.ttf is not a valid font file")
              if os.path.getsize(tk) < 20000: err("fonts/Tektur-Medium.ttf is too small")
          if not os.path.isfile(os.path.join(a, "fonts", "Tektur-OFL.txt")): err("Missing fonts/Tektur-OFL.txt")
          for s in ["crash.mp3", "nitro_loop.mp3", "bike_horn.mp3", "npc_car_horn.mp3"]:
              f = os.path.join(a, "audio", s)
              if not os.path.isfile(f): err("Missing audio/" + s); continue
              h = open(f, "rb").read(3)
              if not (h == b"ID3" or (h[0] == 0xFF and (h[1] & 0xE0) == 0xE0)): err("audio/%s is not an MP3" % s)
          for slug in ["maan_meera", "paro", "ride_it", "gata_only", "love_niwati"]:
              m = os.path.join(a, "music")
              sa, sv, sp = [os.path.join(m, slug + e) for e in (".m4a", ".lyr.mp4", ".png")]
              for f in (sa, sv, sp):
                  if not os.path.isfile(f): err("Missing music/%s" % os.path.basename(f))
              if os.path.isfile(sa) and open(sa, "rb").read(12)[4:8] != b"ftyp": err("music/%s.m4a is not an MP4/M4A audio file" % slug)
              if os.path.isfile(sv):
                  hd = open(sv, "rb").read(12)[4:8]
                  if hd != b"ftyp": err("music/%s.lyr.mp4 is not an MP4 video" % slug)
                  if os.path.getsize(sv) < 500000: err("music/%s.lyr.mp4 is too small" % slug)
              if os.path.isfile(sp) and open(sp, "rb").read(4) != b"\x89PNG": err("music/%s.png is not a PNG" % slug)
          print("music: 5 built-in songs + lyric videos + round pictures checked")
          for e in ["h2r_loop", "h2r_release", "h2r_idle", "h2r_shift"]:
              f = os.path.join(a, "audio", "engine", e + ".wav")
              if not os.path.isfile(f): err("Missing audio/engine/%s.wav" % e)
              elif open(f, "rb").read(4) != b"RIFF": err("audio/engine/%s.wav is not a WAV file" % e)

          SUPPORTED_REQ = {"KHR_materials_emissive_strength", "KHR_mesh_quantization"}
          def check_map(cfgname, want_id, want_dir, min_models):
              cm = json.load(open(os.path.join(a, "config", cfgname)))
              m = cm["map"]
              if m["id"] != want_id: err("%s: map id is %s, expected %d" % (cfgname, m["id"], want_id))
              if m["dir"] != want_dir: err("%s: map dir is %s, expected %s" % (cfgname, m["dir"], want_dir))
              if not os.path.isfile(os.path.join(a, m["preview"])): err("Missing map preview image " + m["preview"])
              elif open(os.path.join(a, m["preview"]), "rb").read(2) != b"\xff\xd8": err(m["preview"] + " is not a JPEG")
              files = []; tot = 0
              if len(cm["models"]) < min_models: err("%s lists only %d models (expected at least %d)" % (cfgname, len(cm["models"]), min_models))
              for mm in cm["models"]:
                  p = mm["file"]; files.append(p)
                  if not p.startswith(want_dir): err("%s: %s is outside %s" % (cfgname, p, want_dir))
                  f = os.path.join(a, p)
                  if not os.path.isfile(f): err("Missing map model %s" % p); continue
                  raw = open(f, "rb").read(); tot += len(raw)
                  if raw[:4] != b"glTF": err("%s is not a valid GLB" % p); continue
                  ver, total = struct.unpack("<II", raw[4:12])
                  if ver != 2 or total != len(raw): err("%s: GLB header / length mismatch" % p); continue
                  jl, jt = struct.unpack("<I4s", raw[12:20])
                  try: j = json.loads(raw[20:20 + jl])
                  except Exception as e: err("%s: JSON chunk unreadable: %s" % (p, e)); continue
                  for e in j.get("extensionsRequired", []):
                      if e not in SUPPORTED_REQ: err("%s requires the unsupported extension %s" % (p, e))
                  if any("uri" in b for b in j.get("buffers", [])): err("%s uses an external buffer" % p)
                  for im in j.get("images", []):
                      if "bufferView" not in im: err("%s: a texture is not embedded" % p); break
                  if not j.get("meshes"): err("%s has no mesh" % p)
                  if want_id == 7 and os.path.basename(p).startswith("billboard_nexus"):
                      if not any("emissiveTexture" in mt for mt in j.get("materials", [])): err("%s has no emissive NEXUS RACING face texture" % p)
              print("%s: %d models checked, %.1f MB" % (m["name"], len(cm["models"]), tot / 1e6))
              return cm, files
          cm6, f6 = check_map("countryside_map.json", 6, "map/countryside/", 20)
          cm7, f7 = check_map("nightcity_map.json", 7, "map/nightcity/", 20)
          if set(f6) & set(f7): err("The two maps share model files: %s" % sorted(set(f6) & set(f7)))
          if cm6["map"]["id"] == cm7["map"]["id"]: err("The two maps have the same id")

          env = open(os.environ["GITHUB_ENV"], "a")
          lst = sorted({(b.get("model") or {}).get("glb") for b in bikes if (b.get("model") or {}).get("glb")}
                       | {r["glb"] for r in json.load(open(a + "/config/riders.json"))} | {n["glb"] for n in npc}
                       | {"ui/bike_%s.png" % b["id"] for b in bikes}
                       | {"fonts/hud_slab.ttf", "fonts/Tektur-Medium.ttf", "fonts/Tektur-OFL.txt", "audio/crash.mp3", "audio/nitro_loop.mp3", "audio/bike_horn.mp3", "audio/npc_car_horn.mp3",
                          "config/bikes.json", "config/npc_vehicles.json", "config/countryside_map.json", "config/nightcity_map.json",
                          "map/ramps/ramp_wood.glb", "map/ramps/ramp_industrial.glb",
                          cm6["map"]["preview"], cm7["map"]["preview"]}
                       | {"audio/engine/%s.wav" % e for e in ["h2r_loop", "h2r_release", "h2r_idle", "h2r_shift"]}
                       | {"music/%s%s" % (sl, e) for sl in ["maan_meera", "paro", "ride_it", "gata_only", "love_niwati"] for e in (".m4a", ".lyr.mp4", ".png")}
                       | set(f6) | set(f7))
          env.write("APK_ASSETS=%s\n" % ",".join(lst))
          env.write("COUNTRY_MODELS=%d\n" % len(f6))
          env.write("NIGHT_MODELS=%d\n" % len(f7))
          env.close()
          sys.exit(1 if errors else 0)
          PY

      # ------------------------------------------------------------ 6. tool versions follow the project's real Android Gradle Plugin
      - name: Read project build requirements
        shell: bash
        run: |
          set -euo pipefail
          AGP=$(grep -oE 'com\.android\.application"\)?[^"]*version "[0-9]+\.[0-9]+(\.[0-9]+)?' "$PROJECT_DIR/build.gradle.kts" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n 1 || true)
          COMPILE=$(grep -oE 'compileSdk *= *[0-9]+' "$PROJECT_DIR/app/build.gradle.kts" | grep -oE '[0-9]+$' | head -n 1 || true)
          if [ -z "$AGP" ] || [ -z "$COMPILE" ]; then
            echo "::error::Could not read the Android Gradle Plugin version ('$AGP') or compileSdk ('$COMPILE') from the project."
            exit 1
          fi
          MM=$(echo "$AGP" | cut -d. -f1,2)
          case "$MM" in
            8.0)  GRADLE=8.0.2;  BT=33.0.1 ;;
            8.1)  GRADLE=8.3;    BT=33.0.1 ;;
            8.2)  GRADLE=8.4;    BT=34.0.0 ;;
            8.3)  GRADLE=8.7;    BT=34.0.0 ;;
            8.4)  GRADLE=8.7;    BT=34.0.0 ;;
            8.5)  GRADLE=8.7;    BT=34.0.0 ;;
            8.6)  GRADLE=8.7;    BT=34.0.0 ;;
            8.7)  GRADLE=8.9;    BT=35.0.0 ;;
            8.8)  GRADLE=8.10.2; BT=35.0.0 ;;
            8.9)  GRADLE=8.11.1; BT=35.0.0 ;;
            8.10) GRADLE=8.11.1; BT=35.0.0 ;;
            8.11) GRADLE=8.13;   BT=35.0.0 ;;
            *)
              echo "::error::Android Gradle Plugin $AGP is not in this workflow's compatibility table. Add it to the 'case' list."
              exit 1 ;;
          esac
          echo "AGP $AGP -> Gradle $GRADLE, compileSdk $COMPILE, build-tools $BT (Java 17)"
          echo "GRADLE_VERSION=$GRADLE" >> "$GITHUB_ENV"
          echo "COMPILE_SDK=$COMPILE" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "::error::Android SDK command-line tools (sdkmanager) were not found under $SDK."
            exit 1
          fi
          echo "SDK: $SDK"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" > sdkmanager.log 2>&1 || { cat sdkmanager.log; echo "::error::sdkmanager could not install platform ${COMPILE_SDK} / build-tools ${BUILD_TOOLS}."; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ------------------------------------------------------------ 6b. decode + check the permanent key
      - name: Prepare the permanent signing key
        shell: bash
        env:
          S_KS: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          S_KSP: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          S_KEYP: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/nexus-release.keystore"
          umask 077
          printf '%s' "$S_KS" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || { rm -f "$KS"; echo "::error::NEXUS_KEYSTORE_BASE64 is not valid Base64. Encode the keystore file again (SIGNING_SETUP_GUIDE.md) and paste it as ONE line."; exit 1; }
          [ -s "$KS" ] || { rm -f "$KS"; echo "::error::NEXUS_KEYSTORE_BASE64 decoded to an empty file."; exit 1; }
          export KS_PASS="$S_KSP" KEY_PASS="$S_KEYP"
          if ! keytool -list -v -keystore "$KS" -storepass:env KS_PASS -alias "$S_ALIAS" > "$RUNNER_TEMP/ks-info.txt" 2> "$RUNNER_TEMP/ks-err.txt"; then
            rm -f "$KS"
            echo "::error::The keystore could not be opened with NEXUS_KEYSTORE_PASSWORD, or the alias NEXUS_KEY_ALIAS does not exist in it. Check both secrets (exact spelling, upper/lower case)."
            exit 1
          fi
          TMP="$RUNNER_TEMP/keycheck.p12"; rm -f "$TMP"
          export TMP_PASS="check-only-not-a-secret"
          if ! keytool -importkeystore -srckeystore "$KS" -srcstorepass:env KS_PASS -srcalias "$S_ALIAS" -srckeypass:env KEY_PASS \
                 -destkeystore "$TMP" -deststoretype PKCS12 -deststorepass:env TMP_PASS -destkeypass:env TMP_PASS -noprompt > /dev/null 2>&1; then
            rm -f "$KS" "$TMP"
            echo "::error::The key password (NEXUS_KEY_PASSWORD) does not match the key. Check the secret."
            exit 1
          fi
          rm -f "$TMP"
          FP=$(grep -m1 'SHA256:' "$RUNNER_TEMP/ks-info.txt" | sed 's/.*SHA256: *//' | tr -d ' ' || true)
          [ -n "$FP" ] || { rm -f "$KS"; echo "::error::Could not read the key fingerprint."; exit 1; }
          grep -E '^(Alias name|Owner|Valid from)' "$RUNNER_TEMP/ks-info.txt" | head -n 5 || true
          rm -f "$RUNNER_TEMP/ks-info.txt" "$RUNNER_TEMP/ks-err.txt"
          echo "Key SHA-256 fingerprint (public information): $FP"
          if [ -n "${NEXUS_EXPECTED_CERT_SHA256:-}" ]; then
            WANT=$(echo "$NEXUS_EXPECTED_CERT_SHA256" | tr -d ': \r\n' | tr 'a-f' 'A-F')
            HAVE=$(echo "$FP" | tr -d ':' | tr 'a-f' 'A-F')
            if [ "$WANT" != "$HAVE" ]; then
              rm -f "$KS"
              echo "::error::This keystore is NOT the key you registered (variable NEXUS_EXPECTED_CERT_SHA256). Build stopped."
              exit 1
            fi
            echo "Fingerprint matches the registered key (NEXUS_EXPECTED_CERT_SHA256)."
          else
            echo "::warning::Variable NEXUS_EXPECTED_CERT_SHA256 is not set yet. Save the fingerprint above as that variable."
          fi
          echo "KEY_FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "NEXUS_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      # ------------------------------------------------------------ 6c. unit tests (informational)
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/unit-tests.log"

      # ------------------------------------------------------------ 6d. the release build, signed with the permanent key
      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ARGS=("-PNEXUS_VERSION_CODE=${NEXUS_VERSION_CODE}" "-PNEXUS_VERSION_NAME=${NEXUS_VERSION_NAME}")
          if [ -n "${NEXUS_BACKEND_URL:-}" ]; then ARGS+=("-PNEXUS_BACKEND_URL=${NEXUS_BACKEND_URL}"); fi
          echo "Building :app:assembleRelease  versionCode=${NEXUS_VERSION_CODE}  versionName=${NEXUS_VERSION_NAME}"
          gradle :app:assembleRelease "${ARGS[@]}" --stacktrace --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ------------------------------------------------------------ 7. find the real APK, verify
      - name: Find the release APK (path read from Gradle's own output file)
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PROJECT_DIR/app/build/outputs/apk/release"
          [ -d "$OUT" ] || { echo "::error::$OUT does not exist: the release build produced no APK folder."; exit 1; }
          python3 - "$OUT" <<'PY'
          import json, os, sys
          out = sys.argv[1]
          meta = os.path.join(out, "output-metadata.json")
          if not os.path.isfile(meta):
              print("::error::No output-metadata.json in " + out + ". Files: " + ", ".join(os.listdir(out))); sys.exit(1)
          m = json.load(open(meta))
          el = [e for e in m.get("elements", []) if e.get("type") == "SINGLE"]
          if len(el) != 1:
              print("::error::Expected exactly one APK in output-metadata.json, found %d" % len(el)); sys.exit(1)
          apk = os.path.abspath(os.path.join(out, el[0]["outputFile"]))
          if not os.path.isfile(apk):
              print("::error::" + apk + " is listed but missing"); sys.exit(1)
          if "unsigned" in os.path.basename(apk):
              print("::error::The release APK is UNSIGNED (" + os.path.basename(apk) + "). The signing key was not applied."); sys.exit(1)
          print("variant     : " + str(m.get("variantName")))
          print("applicationId (Gradle): " + str(m.get("applicationId")))
          print("versionCode (Gradle)  : " + str(el[0].get("versionCode")))
          print("versionName (Gradle)  : " + str(el[0].get("versionName")))
          print("APK file    : " + apk + "  (" + str(os.path.getsize(apk)) + " bytes)")
          open(os.environ["GITHUB_ENV"], "a").write("APK_PATH=%s\nGRADLE_APP_ID=%s\n" % (apk, m.get("applicationId")))
          PY

      - name: Verify signature, package name, version and debuggable flag
        shell: bash
        run: |
          set -euo pipefail
          : "${APK_PATH:?The APK path was not passed from the previous step}"
          [ -f "$APK_PATH" ] || { echo "::error::APK file not found: $APK_PATH"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          [ -x "$BT/apksigner" ] && [ -x "$BT/aapt2" ] || { echo "::error::apksigner / aapt2 not found in $BT"; exit 1; }
          APK="$APK_PATH"
          WANT_ID=$(grep -oE 'applicationId *= *"[^"]+"' "$PROJECT_DIR/app/build.gradle.kts" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$WANT_ID" ] || { echo "::error::applicationId not found in app/build.gradle.kts"; exit 1; }

          echo "== apksigner verify =="
          "$BT/apksigner" verify --verbose --print-certs "$APK" > sign.txt 2>&1 || { cat sign.txt; echo "::error::apksigner says the APK signature is NOT valid."; exit 1; }
          grep -E 'Verifies|Verified using|Number of signers|certificate DN|certificate SHA-256' sign.txt || true
          grep -q '^Verifies' sign.txt || { echo "::error::APK signature did not verify."; exit 1; }
          if ! grep -Eq 'Verified using v(2|3)[^:]*: true' sign.txt; then echo "::error::The APK has no v2/v3 signature."; exit 1; fi
          grep -q 'Number of signers: 1' sign.txt || { echo "::error::Expected exactly one signer."; exit 1; }
          if grep -qi 'CN=Android Debug' sign.txt; then echo "::error::The APK is signed with the Android DEBUG key, not your permanent key."; exit 1; fi
          APK_FP=$(grep -m1 'certificate SHA-256 digest' sign.txt | sed 's/.*: *//' | tr -d ' :' | tr 'a-f' 'A-F')
          KEY_FP=$(echo "$KEY_FINGERPRINT" | tr -d ':' | tr 'a-f' 'A-F')
          if [ "$APK_FP" != "$KEY_FP" ]; then echo "::error::The APK certificate ($APK_FP) is not the certificate of the permanent key ($KEY_FP)."; exit 1; fi
          echo "OK  signature valid, signed with the permanent key (SHA-256 $APK_FP)"

          echo "== aapt2 badging =="
          "$BT/aapt2" dump badging "$APK" > badging.txt
          PKG_LINE=$(grep -m1 '^package:' badging.txt)
          echo "$PKG_LINE"
          GOT_ID=$(echo "$PKG_LINE" | sed -E "s/^package: name='([^']*)'.*/\1/")
          GOT_CODE=$(echo "$PKG_LINE" | sed -E "s/.* versionCode='([^']*)'.*/\1/")
          GOT_NAME=$(echo "$PKG_LINE" | sed -E "s/.* versionName='([^']*)'.*/\1/")
          [ "$GOT_ID" = "$WANT_ID" ]   || { echo "::error::Package name in the APK is $GOT_ID but app/build.gradle.kts says $WANT_ID."; exit 1; }
          [ "$GOT_CODE" = "$NEXUS_VERSION_CODE" ] || { echo "::error::versionCode in the APK is $GOT_CODE but $NEXUS_VERSION_CODE was requested."; exit 1; }
          [ "$GOT_NAME" = "$NEXUS_VERSION_NAME" ] || { echo "::error::versionName in the APK is $GOT_NAME but $NEXUS_VERSION_NAME was requested."; exit 1; }
          if grep -q 'application-debuggable' badging.txt; then echo "::error::The release APK is DEBUGGABLE."; exit 1; fi
          echo "OK  package=$GOT_ID versionCode=$GOT_CODE versionName=$GOT_NAME debuggable=false"
          grep -E '^(sdkVersion|targetSdkVersion|uses-permission)' badging.txt || true

          echo "== no key files inside the APK =="
          if unzip -Z1 "$APK" | grep -Eiq '\.(jks|keystore|p12|pfx|pem)$'; then echo "::error::The APK contains a key file."; exit 1; fi
          echo "OK  no key files in the APK"
          echo "APK_FP=$APK_FP" >> "$GITHUB_ENV"
          echo "APK_PACKAGE=$GOT_ID" >> "$GITHUB_ENV"

      - name: Verify the APK contains the assets and the game code
        shell: bash
        env:
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          set -euo pipefail
          : "${APK_PATH:?The APK path was not passed from the previous step}"
          [ -f "$APK_PATH" ] || { echo "::error::APK file not found: $APK_PATH"; exit 1; }
          APK="$APK_PATH"
          unzip -Z1 "$APK" > apk-files.txt
          IFS=',' read -ra LIST <<< "$APK_ASSETS"
          MISS=0
          for A in "${LIST[@]}"; do
            if ! grep -qx "assets/$A" apk-files.txt; then echo "::error::The APK does not contain assets/$A."; MISS=1; fi
          done
          [ "$MISS" = 0 ] || exit 1
          unzip -p "$APK" 'classes*.dex' > dex-all.bin
          for C in NightCityCard CountrysideCard LyricsLayer GradeCode StreakDrawable GradeKit AmbientView ShineView StuntState RampField StuntCode RampType; do
            grep -aq "$C" dex-all.bin || { echo "::error::The APK code does not contain $C."; exit 1; }
          done
          rm -f dex-all.bin
          echo "APK contains all ${#LIST[@]} checked assets (bikes, riders, NPC vehicles, sounds, ${COUNTRY_MODELS} COUNTRYSIDE models, ${NIGHT_MODELS} NIGHT CITY models, the 2 stunt ramps), both map cards, 5 songs with lyric videos, lyrics layer, colour grading, animation layer and the stunt / ramp system."
          FINAL="$GITHUB_WORKSPACE/NEXUS_RACING-${NEXUS_VERSION_NAME}-code${NEXUS_VERSION_CODE}-release.apk"
          cp "$APK" "$FINAL"
          echo "FINAL_APK=$FINAL" >> "$GITHUB_ENV"
          SUM=$(sha256sum "$FINAL" | cut -d' ' -f1)
          {
            echo "## NEXUS RACING signed release APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$FINAL")\` |"
            echo "| Package | \`${APK_PACKAGE}\` |"
            echo "| versionCode | \`${NEXUS_VERSION_CODE}\` |"
            echo "| versionName | \`${NEXUS_VERSION_NAME}\` |"
            echo "| Signing key SHA-256 | \`${APK_FP}\` |"
            echo "| APK SHA-256 | \`${SUM}\` |"
            echo "| Unit tests | ${UNIT_TESTS_OUTCOME:-not run} |"
            echo ""
            echo "Download: scroll to **Artifacts** at the bottom of this page and tap **NEXUS_RACING-release-apk**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore from the runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nexus-release.keystore" "$RUNNER_TEMP/keycheck.p12" "$RUNNER_TEMP/ks-info.txt" "$RUNNER_TEMP/ks-err.txt" || true
          echo "Temporary key files removed."

      - name: Show build error summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build error summary"
            echo '```'
            if [ -f build.log ]; then
              grep -n -B2 -A25 "What went wrong" build.log | head -80 || true
              echo "--- lines mentioning errors ---"
              grep -n -E "^e: |error:|Execution failed|FAILED|Could not|ERROR" build.log | head -40 || true
            else
              echo "No build.log: the failure happened before the Gradle build step (see the failed step above)."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            unit-tests.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_RACING-release-apk
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 30
